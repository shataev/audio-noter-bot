name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Catches syntax errors in every file, including the ones ruff is
      # currently excluded from.
      - name: Byte-compile
        run: python -m compileall -q bot.py config.py services tests

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Tests
        run: pytest -q
